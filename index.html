<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f4ed" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="燃刻" />
  <meta name="description" content="燃刻，一款完全离线运行的健身饮食与恢复记录工具。" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>燃刻 · 把身体练成答案</title>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <main id="screen" class="screen" tabindex="-1">
      <div class="skeleton-card"></div>
      <div class="skeleton-card short"></div>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item is-active" data-nav="today" aria-label="今日">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>
        </span>
        <span>今日</span>
      </button>
      <button class="nav-item" data-nav="record" aria-label="记录">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </span>
        <span>记录</span>
      </button>
      <button class="nav-item" data-nav="trends" aria-label="趋势">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg>
        </span>
        <span>趋势</span>
      </button>
      <button class="nav-item" data-nav="profile" aria-label="我的">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c.5-4 2.7-6 6.5-6s6 2 6.5 6"/></svg>
        </span>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="bottom-sheet" id="bottomSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden />
  <div class="install-tip" id="installTip" hidden></div>

  <script src="./app.js" defer></script>
</body>
</html>
